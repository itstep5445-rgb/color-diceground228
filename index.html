<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Цветные кубики онлайн — Генератор бросков (Color Dice)</title>
    <meta name="description" content="Бесплатный онлайн-генератор цветных кубиков. Выберите от 1 до 6 кубиков, настройте свою тему оформления, фото или видео на фон и бросайте кубики.">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #1e293b;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 15px;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-color 0.3s, color 0.3s;
            position: relative;
        }
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            display: none;
        }
        body.theme-dark {
            background-color: #0f172a;
            color: #f8fafc;
        }
        body.theme-dark .container {
            background: rgba(30, 41, 59, 0.92);
            color: #f8fafc;
        }
        body.theme-dark h1, body.theme-dark .rules h2 {
            color: #ffffff;
        }
        body.theme-dark .subtitle, body.theme-dark .rules {
            color: #cbd5e1;
        }
        body.theme-dark .dice-arena {
            background: rgba(15, 23, 42, 0.7);
            border-color: #475569;
        }
        body.theme-dark .count-btn {
            background: #1e293b;
            color: #f8fafc;
            border-color: #475569;
        }
        body.theme-glass .container {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            max-width: 740px;
            width: 100%;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            transition: background 0.3s;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
            color: #0f172a;
        }
        .subtitle {
            color: #64748b;
            margin-bottom: 20px;
            font-size: 1rem;
        }
        .section-label {
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: block;
            opacity: 0.85;
        }
        .count-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
        }
        .count-btn {
            padding: 10px 16px;
            border: 2px solid #cbd5e1;
            background: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            color: #334155;
            transition: all 0.2s;
        }
        .count-btn:hover {
            border-color: #3b82f6;
        }
        .count-btn.active {
            background: #3b82f6 !important;
            color: #fff !important;
            border-color: #3b82f6 !important;
        }
        .colors-legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .color-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: rgba(148, 163, 184, 0.15);
        }
        .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }
        .dice-arena {
            min-height: 140px;
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 25px;
            margin-bottom: 25px;
        }
        .dice {
            width: 85px;
            height: 85px;
            border-radius: 16px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2), inset 0 -4px 0 rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 0.85rem;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        .dice.rolling {
            animation: shake 0.35s ease-in-out;
        }
        @keyframes shake {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-18deg) scale(1.1); }
            50% { transform: rotate(18deg) scale(0.95); }
            75% { transform: rotate(-10deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .roll-btn {
            background: #10b981;
            color: #fff;
            border: none;
            padding: 16px 45px;
            font-size: 1.25rem;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
            transition: background 0.2s, transform 0.1s;
        }
        .roll-btn:hover {
            background: #059669;
        }
        .roll-btn:active {
            transform: scale(0.97);
        }
        .custom-panel {
            margin-top: 30px;
            padding: 18px;
            border-radius: 12px;
            background: rgba(148, 163, 184, 0.12);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .tool-btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid #94a3b8;
            background: #ffffff;
            color: #1e293b;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .tool-btn:hover {
            background: #e2e8f0;
        }
        input[type="file"] {
            display: none;
        }
        .rules {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(148, 163, 184, 0.3);
            text-align: left;
            color: #475569;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .rules h2 {
            font-size: 1.1rem;
            color: #0f172a;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <video id="bgVideo" autoplay loop muted playsinline></video>

    <div class="container">
        <h1>Цветные кубики</h1>
        <p class="subtitle">Онлайн-генератор бросков (Color Dice)</p>

        <span class="section-label">1. Выберите количество кубиков</span>
        <div class="count-selector" id="countSelector">
            <button class="count-btn active" data-count="1">1 кубик</button>
            <button class="count-btn" data-count="2">2 кубика</button>
            <button class="count-btn" data-count="3">3 кубика</button>
            <button class="count-btn" data-count="4">4 кубика</button>
            <button class="count-btn" data-count="5">5 кубиков</button>
            <button class="count-btn" data-count="6">6 кубиков</button>
        </div>

        <span class="section-label">2. Цвета на гранях (всегда активны)</span>
        <div class="colors-legend">
            <div class="color-badge"><span class="color-dot" style="background: #ef4444;"></span>КРАСНЫЙ</div>
            <div class="color-badge"><span class="color-dot" style="background: #f97316;"></span>ОРАНЖЕВЫЙ</div>
            <div class="color-badge"><span class="color-dot" style="background: #eab308;"></span>ЖЕЛТЫЙ</div>
            <div class="color-badge"><span class="color-dot" style="background: #22c55e;"></span>ЗЕЛЕНЫЙ</div>
            <div class="color-badge"><span class="color-dot" style="background: #3b82f6;"></span>СИНИЙ</div>
            <div class="color-badge"><span class="color-dot" style="background: #a855f7;"></span>ФИОЛЕТОВЫЙ</div>
        </div>

        <div class="dice-arena" id="diceArena"></div>

        <button class="roll-btn" id="rollBtn">БРОСИТЬ !</button>

        <div class="custom-panel">
            <span class="section-label" style="width: 100%; margin-bottom: 5px;">Настройка темы и фона</span>
            <button class="tool-btn" onclick="setTheme('light')">Светлая тема</button>
            <button class="tool-btn" onclick="setTheme('dark')">Темная тема</button>
            <button class="tool-btn" onclick="setTheme('glass')">Прозрачная тема</button>
            
            <label class="tool-btn">
                Загрузить фото на фон
                <input type="file" id="bgImageInput" accept="image/*">
            </label>

            <label class="tool-btn">
                Загрузить видео на фон
                <input type="file" id="bgVideoInput" accept="video/*">
            </label>

            <button class="tool-btn" onclick="resetBackground()">Сбросить фон</button>
        </div>

        <div class="rules">
            <h2>Правила и возможности</h2>
