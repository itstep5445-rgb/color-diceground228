<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Dice — Генератор цветных кубиков</title>
    <style>
        :root {
            --page-bg: #a3c8ff;
            --card-bg: #4a96f3;
            --card-border: #ffffff;
            --text-color: #ffffff;
            --select-bg: #ffffff;
            --select-text: #1e293b;
            --checkbox-panel-bg: rgba(255, 255, 255, 0.88);
            --roll-btn-bg: linear-gradient(180deg, #fde047 0%, #facc15 100%);
            --roll-btn-shadow: #ca8a04;
            --roll-btn-text: #ffffff;
        }

        /* === ТЕМЫ ОФОРМЛЕНИЯ === */
        /* 1. День (по умолчанию, как на скриншоте) */
        body.theme-day {
            --page-bg: linear-gradient(180deg, #93c5fd 0%, #bfdbfe 100%);
            --card-bg: #4a96f3;
            --card-border: #ffffff;
        }

        /* 2. Ночь */
        body.theme-night {
            --page-bg: radial-gradient(circle at 20% 20%, #1e1b4b 0%, #090d16 100%);
            --card-bg: rgba(23, 37, 84, 0.85);
            --card-border: #60a5fa;
            --checkbox-panel-bg: rgba(15, 23, 42, 0.85);
        }

        /* 3. Юпитер */
        body.theme-jupiter {
            --page-bg: linear-gradient(160deg, #7c2d12 0%, #c2410c 25%, #fed7aa 50%, #9a3412 75%, #431407 100%);
            --card-bg: rgba(124, 45, 18, 0.82);
            --card-border: #fdba74;
            --checkbox-panel-bg: rgba(255, 247, 237, 0.9);
            --roll-btn-bg: linear-gradient(180deg, #fb923c 0%, #ea580c 100%);
            --roll-btn-shadow: #9a3412;
        }

        /* 4. Сатурн */
        body.theme-saturn {
            --page-bg: radial-gradient(ellipse at center, #fef08a 0%, #d97706 40%, #451a03 85%, #1c1917 100%);
            --card-bg: rgba(120, 53, 15, 0.82);
            --card-border: #fde047;
            --checkbox-panel-bg: rgba(254, 252, 232, 0.92);
        }

        /* 5. Марс */
        body.theme-mars {
            --page-bg: linear-gradient(180deg, #450a0a 0%, #991b1b 45%, #ea580c 100%);
            --card-bg: rgba(127, 29, 29, 0.82);
            --card-border: #fca5a5;
            --checkbox-panel-bg: rgba(254, 242, 242, 0.9);
        }

        /* 6. Нептун */
        body.theme-neptune {
            --page-bg: linear-gradient(135deg, #020617 0%, #1d4ed8 50%, #06b6d4 100%);
            --card-bg: rgba(30, 58, 138, 0.82);
            --card-border: #67e8f9;
            --checkbox-panel-bg: rgba(236, 254, 255, 0.9);
        }

        /* 7. Прозрачная (Glass) */
        body.theme-glass {
            --card-bg: rgba(255, 255, 255, 0.2);
            --card-border: rgba(255, 255, 255, 0.7);
            --checkbox-panel-bg: rgba(255, 255, 255, 0.82);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: var(--page-bg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.4s ease;
        }

        /* Звездная пыль для космических тем */
        body.theme-night::before,
        body.theme-saturn::before,
        body.theme-neptune::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(#ffffff 1px, transparent 1px),
                              radial-gradient(rgba(255,255,255,0.6) 1px, transparent 1px);
            background-size: 50px 50px, 90px 90px;
            background-position: 0 0, 25px 25px;
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
        }

        #bgVideo {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            display: none;
        }

        .main-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 680px;
            background: var(--card-bg);
            border: 3px solid var(--card-border);
            border-radius: 24px;
            padding: 32px 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-align: center;
            transition: background 0.3s ease
