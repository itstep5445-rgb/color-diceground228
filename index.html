<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Цветные кубики онлайн — Генератор бросков</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:#f4f6f9;
    color:#1e293b;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    flex-direction:column;
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

#bgVideo{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:-1;
}

.container{
    max-width:750px;
    width:100%;
    background:rgba(255,255,255,0.95);
    border-radius:16px;
    padding:30px;
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,.15);
}

.theme-dark{
    background:#0f172a;
    color:white;
}

.theme-glass .container{
    background:rgba(255,255,255,.7);
    backdrop-filter:blur(12px);
}

h1{
    margin-bottom:10px;
}

.subtitle{
    color:#64748b;
    margin-bottom:20px;
}

.section-label{
    display:block;
    margin:15px 0 10px;
    font-weight:700;
}

.count-selector{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.count-btn{
    padding:10px 15px;
    border:2px solid #cbd5e1;
    background:white;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.count-btn.active{
    background:#3b82f6;
    color:white;
    border-color:#3b82f6;
}

.colors-legend{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

.color-badge{
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 12px;
    border-radius:20px;
    background:#eef2f7;
}

.color-dot{
    width:14px;
    height:14px;
    border-radius:50%;
}

.dice-arena{
    min-height:150px;
    border:2px dashed #cbd5e1;
    border-radius:12px;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
    padding:25px;
    margin-bottom:20px;
}

.dice{
    width:90px;
    height:90px;
    border-radius:16px;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-weight:bold;
    text-align:center;
    box-shadow:0 6px 12px rgba(0,0,0,.2);
}

.rolling{
    animation:shake .35s ease;
}

@keyframes shake{
    0%{transform:rotate(0);}
    25%{transform:rotate(-15deg);}
    50%{transform:rotate(15deg);}
    75%{transform:rotate(-8deg);}
    100%{transform:rotate(0);}
}

.roll-btn{
    background:#10b981;
    color:white;
    border:none;
    padding:15px 40px;
    font-size:20px;
    font-weight:bold;
    border-radius:12px;
    cursor:pointer;
}

.custom-panel{
    margin-top:25px;
    padding:15px;
    background:#eef2f7;
    border-radius:12px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

.tool-btn{
    padding:8px 14px;
    border:1px solid #94a3b8;
    border-radius:8px;
    background:white;
    cursor:pointer;
}

input[type=file]{
    display:none;
}

.rules{
    margin-top:20px;
    text-align:left;
    line-height:1.6;
}
</style>
</head>

<body>

<video id="bgVideo" autoplay muted loop playsinline></video>

<div class="container">

<h1>Цветные кубики</h1>
<p class="subtitle">Онлайн-генератор бросков (Color Dice)</p>

<span class="section-label">Выберите количество кубиков</span>

<div class="count-selector">
    <button class="count-btn active" data-count="1">1</button>
    <button class="count-btn" data-count="2">2</button>
    <button class="count-btn" data-count="3">3</button>
    <button class="count-btn" data-count="4">4</button>
    <button class="count-btn" data-count="5">5</button>
    <button class="count-btn" data-count="6">6</button>
</div>

<div class="colors-legend">
    <div class="color-badge"><span class="color-dot" style="background:#ef4444"></span>Красный</div>
    <div class="color-badge"><span class="color-dot" style="background:#f97316"></span>Оранжевый</div>
    <div class="color-badge"><span class="color-dot" style="background:#eab308"></span>Жёлтый</div>
    <div class="color-badge"><span class="color-dot" style="background:#22c55e"></span>Зелёный</div>
    <div class="color-badge"><span class="color-dot" style="background:#3b82f6"></span>Синий</div>
    <div class="color-badge"><span class="color-dot" style="background:#a855f7"></span>Фиолетовый</div>
</div>

<div class="dice-arena" id="diceArena"></div>

<button class="roll-btn" id="rollBtn">БРОСИТЬ!</button>

<div class="custom-panel">
    <button class="tool-btn" onclick="setTheme('light')">Светлая</button>
    <button class="tool-btn" onclick="setTheme('dark')">Тёмная</button>
    <button class="tool-btn" onclick="setTheme('glass')">Стекло</button>

    <label class="tool-btn">
        Фото
        <input type="file" id="bgImageInput" accept="image/*">
    </label>

    <label class="tool-btn">
        Видео
        <input type="file" id="bgVideoInput" accept="video/*">
    </label>

    <button class="tool-btn" onclick="resetBackground()">Сброс</button>
</div>

<div class="rules">
<h2>Правила</h2>
<p>Выберите количество кубиков и нажмите кнопку «БРОСИТЬ!». На каждом кубике случайным образом появляется один из шести цветов.</p>
</div>

</div>

<script>
let diceCount = 1;

const fixedColors = [
{name:'КРАСНЫЙ',hex:'#ef4444'},
{name:'ОРАНЖЕВЫЙ',hex:'#f97316'},
{name:'ЖЁЛТЫЙ',hex:'#eab308'},
{name:'ЗЕЛЁНЫЙ',hex:'#22c55e'},
{name:'СИНИЙ',hex:'#3b82f6'},
{name:'ФИОЛЕТОВЫЙ',hex:'#a855f7'}
];

const diceArena = document.getElementById('diceArena');
const rollBtn = document.getElementById('rollBtn');
const countButtons = document.querySelectorAll('.count-btn');
const bgVideo = document.getElementById('bgVideo');

countButtons.forEach(btn=>{
    btn.addEventListener('click',()=>{
        countButtons.forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        diceCount = Number(btn.dataset.count);
        rollDice();
    });
});

function rollDice(){
    diceArena.innerHTML='';

    for(let i=0;i<diceCount;i++){

        const color =
        fixedColors[Math.floor(Math.random()*fixedColors.length)];

        const dice = document.createElement('div');

        dice.className='dice rolling';
        dice.style.background=color.hex;
        dice.textContent=color.name;

        diceArena.appendChild(dice);
    }
}

rollBtn.addEventListener('click',rollDice);

document.addEventListener('keydown',e=>{
    if(e.code==='Space'){
        e.preventDefault();
        rollDice();
    }
});

function setTheme(theme){
    document.body.classList.remove('theme-dark','theme-glass');

    if(theme==='dark'){
        document.body.classList.add('theme-dark');
    }

    if(theme==='glass'){
        document.body.classList.add('theme-glass');
    }
}

document
.getElementById('bgImageInput')
.addEventListener('change',function(e){

    const file = e.target.files[0];

    if(file){

        bgVideo.style.display='none';
        bgVideo.src='';

        const url = URL.createObjectURL(file);

        document.body.style.backgroundImage =
        `url('${url}')`;
    }
});

document
.getElementById('bgVideoInput')
.addEventListener('change',function(e){

    const file=e.target.files[0];

    if(file){

        document.body.style.backgroundImage='none';

        const url=URL.createObjectURL(file);

        bgVideo.src=url;
        bgVideo.style.display='block';
    }
});

function resetBackground(){

    document.body.style.backgroundImage='none';
    bgVideo.src='';
    bgVideo.style.display='none';

    document.body.classList.remove(
        'theme-dark',
        'theme-glass'
    );
}

rollDice();
</script>

</body>
</html>
